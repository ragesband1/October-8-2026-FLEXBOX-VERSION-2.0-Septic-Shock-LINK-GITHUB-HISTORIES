<style>
body {
  margin: 0; padding: 0;
  height: 100vh; width: 100vw;
  overflow: hidden;
  background: black;
  position: relative;
  font-family: Arial, sans-serif;
}
.background {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: url('1.png');
  background-size: cover; background-position: center;
  transition: opacity 0.4s ease;
  z-index: 1;
  filter: contrast(1.2) saturate(1.4) brightness(1.1);
}
.gradient-overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(255,0,255,0.4);
  animation: bodyGradient 2.5s infinite linear, septicFlash 0.2s infinite;
  z-index: 2;
}
.border {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  box-sizing: border-box;
  border: 12px solid transparent;
  border-image-slice: 1;
  border-image-source: linear-gradient(45deg,magenta,deeppink,red,purple);
  border-image-repeat: stretch;
  animation: borderPulse 0.7s infinite, septicShock 0.12s infinite;
  z-index: 3;
}
@keyframes septicShock {
  0% { transform: translate(0,0) }
  15% { transform: translate(-3px,2px) skew(1.5deg) }
  30% { transform: translate(3px,-2px) skew(-1.5deg) }
  100% { transform: translate(0,0) }
}
@keyframes septicFlash {
  0%,90%,100% { opacity: 1 }
  95% { opacity: 0.8; filter: brightness(2) }
}
@keyframes bodyGradient {
  0% { filter: hue-rotate(0deg) }
  100% { filter: hue-rotate(360deg) }
}
@keyframes borderPulse {
  0% { border-color: magenta }
  50% { border-color: cyan }
  100% { border-color: magenta }
}
.grid-container {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  display: grid;
  grid-template-columns: repeat(10,80px);
  grid-template-rows: repeat(5,80px);
  gap: 10px;
  z-index: 10;
}
.box {
  width: 80px; height: 80px;
  display: flex; justify-content: center; align-items: center;
  background: transparent;
  border: 3px solid transparent;
  border-radius: 15px;
  cursor: pointer;
  font-size: 10px; font-weight: 900;
  color: white;
  animation: neonBlink 1s infinite alternate;
  box-shadow: inset 0 0 0 3px var(--neon-color,magenta),
              0 0 10px var(--neon-color),
              0 0 20px var(--neon-color);
  text-align: center;
}
@keyframes neonBlink {
  0% { text-shadow: 0 0 10px cyan }
  100% { text-shadow: 0 0 20px magenta }
}
.box:nth-child(odd) { --neon-color: magenta }
.box:nth-child(even) { --neon-color: cyan }
.modal {
  display: none; position: fixed;
  z-index: 999; left: 0; top: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
}
.modal-content {
  background: #fefefe;
  margin: 15% auto; padding: 20px;
  border-radius: 10px;
  width: 80%; max-width: 500px;
  position: relative; text-align: center;
}
.close {
  position: absolute; top: 10px; right: 15px;
  font-size: 28px; font-weight: bold; cursor: pointer;
}
.link-button {
  display: inline-block;
  background: blue; color: #fff;
  padding: 12px 20px; margin-top: 10px;
  border-radius: 5px; border: none;
  cursor: pointer; font-weight: 900;
  min-width: 120px; text-decoration: none;
  word-break: break-all; font-size: 11px;
}
.browse-box {
  border: 4px solid lime;
  box-shadow: 0 0 20px lime;
  animation: septicShock 0.1s infinite;
}
</style>

// 50th BOX = MAIN NO LINK BROWSE NEW TAB
let mainBox = document.createElement('div');

function showDialog(link) {
  const modal = document.getElementById('myModal');
  const content = document.getElementById('modalContent');
  modal.style.display = 'block';
  if (link && link !== "") {
    content.innerHTML = `
      <span class="close" onclick="closeAll()">×</span>
      <p>CLICK THIS LINK HERE:</p>
      <a href="${link}" target="_blank" class="link-button">${link}</a>
    `;
  } else {
    content.innerHTML = `
      <span class="close" onclick="closeAll()">×</span>
      <p>CLICK THIS LINK HERE:</p>
      <button class="link-button" id="noLinkBtn">No Link</button>
    `;
    setTimeout(() => {
      document.getElementById('noLinkBtn').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('myModal').style.display = 'none';
        setTimeout(() => {
          document.getElementById('browseModal').style.display = 'block';
          window.open(window.location.href, '_blank');
        }, 200);
      });
    }, 100);
  }
}

function closeAll() {
  document.getElementById('myModal').style.display = 'none';
  document.getElementById('browseModal').style.display = 'none';
}

function goMain() {
  closeAll();
  window.open('index.html', '_blank');
}

window.onclick = (e) => {
  if (e.target === document.getElementById('myModal')) {
    document.getElementById('myModal').style.display = 'none';
  }
  if (e.target === document.getElementById('browseModal')) {

};
